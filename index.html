<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOMEchat - Canlı Görüntülü Sohbet</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* KENDİ ORİJİNAL MOR VE SİYAH TASARIMINIZ */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #c5c6c7; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background-color: #15191e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c3540; }
        .logo { font-size: 24px; font-weight: bold; color: #fff; }
        .logo span { color: #8a2be2; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        #localUsername { color: #8a2be2; font-weight: bold; }
        .logout-btn { background: none; border: 1px solid #ff4a4a; color: #ff4a4a; padding: 5px 10px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .logout-btn:hover { background-color: #ff4a4a; color: #fff; }
        
        .main-container { flex: 1; display: flex; position: relative; height: calc(100vh - 70px); }
        .video-section { flex: 1; position: relative; background-color: #000; display: flex; flex-direction: column; }
        #remoteVideoContainer { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; top: 20px; right: 20px; width: 150px; height: 110px; object-fit: cover; border-radius: 10px; border: 2px solid #8a2be2; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; transform: scaleX(-1); }
        
        .video-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
        .control-btn { background-color: rgba(21, 25, 30, 0.8); border: 1px solid #2c3540; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px); }
        .control-btn:hover { border-color: #8a2be2; color: #8a2be2; box-shadow: 0 0 15px rgba(138, 43, 226, 0.4); }
        .control-btn.skip { border-color: #8a2be2; background-color: #8a2be2; color: #fff; width: 140px; border-radius: 30px; font-weight: bold; font-size: 16px; gap: 8px; }
        .control-btn.skip:hover { background-color: #7322bd; box-shadow: 0 0 15px #8a2be2; }
        
        .remote-info-tag { position: absolute; top: 20px; left: 20px; background-color: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; border-left: 4px solid #8a2be2; font-weight: bold; z-index: 10; }
        #status { position: absolute; top: 70px; left: 20px; background-color: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 5px; font-size: 14px; z-index: 10; color: #aaa; }
        
        .chat-section { width: 350px; background-color: #111418; display: flex; flex-direction: column; border-left: 1px solid #2c3540; }
        .chat-header { padding: 15px; background-color: #15191e; font-weight: bold; border-bottom: 1px solid #2c3540; display: flex; align-items: center; gap: 10px; }
        #chatMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-break: break-word; }
        .msg.me { background-color: #8a2be2; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.stranger { background-color: #1c222b; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #2c3540; }
        .msg.system { background-color: rgba(138, 43, 226, 0.1); color: #8a2be2; align-self: center; text-align: center; font-size: 13px; max-width: 100%; border-radius: 5px; padding: 5px 10px; }
        .chat-input-area { padding: 15px; background-color: #15191e; display: flex; gap: 10px; border-top: 1px solid #2c3540; }
        #chatInput { flex: 1; background-color: #1c222b; border: 1px solid #2c3540; padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        #chatInput:focus { border-color: #8a2be2; }
        #sendBtn { background-color: #8a2be2; border: none; color: #fff; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        #sendBtn:hover { background-color: #7322bd; }

        /* GİRİŞ EKRANI */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0b0c10; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .login-box { background-color: #15191e; padding: 40px; border-radius: 20px; border: 1px solid #2c3540; width: 420px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; }
        .login-box h1 { font-size: 36px; margin-bottom: 5px; color: #fff; }
        .login-box h1 span { color: #8a2be2; }
        .login-box p { color: #667085; font-size: 14px; margin-bottom: 30px; }
        .google-btn { width: 100%; background-color: #1c222b; color: #fff; border: 1px solid #333c4d; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 20px; transition: 0.2s; }
        .google-btn:hover { background-color: #252d3a; border-color: #45546c; }
        .or-divider { margin: 25px 0; color: #475467; font-size: 13px; }
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid #2c3540; }
        .tab { flex: 1; padding: 12px; cursor: pointer; color: #667085; font-weight: 600; font-size: 15px; text-align: center; }
        .tab.active { color: #8a2be2; border-bottom: 2px solid #8a2be2; margin-bottom: -1px; }
        .login-form input { width: 100%; background-color: #1c222b; border: 1px solid #2c3540; padding: 14px; border-radius: 10px; color: #fff; margin-bottom: 16px; outline: none; font-size: 14px; }
        .login-form input:focus { border-color: #8a2be2; }
        .login-form button { width: 100%; background-color: #8a2be2; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .login-form button:hover { background-color: #7322bd; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h1>ZOME<span>chat</span></h1>
            <p>Devam etmek için giriş yapın veya kayıt olun.</p>
            <button class="google-btn" id="googleLoginBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google__G__Logo.svg" alt="Google" width="18"> Google ile Giriş Yap
            </button>
            <div class="or-divider">veya e-posta kullanın</div>
            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="switchTab('login')">Giriş Yap</div>
                <div class="tab" id="tabRegister" onclick="switchTab('register')">Kayıt Ol</div>
            </div>
            <div class="login-form">
                <input type="text" id="authUsername" placeholder="Kullanıcı Adınız" style="display: none;">
                <input type="email" id="authEmail" placeholder="E-posta Adresiniz">
                <input type="password" id="authPassword" placeholder="Şifreniz">
                <button id="authSubmitBtn" onclick="handleAuthSubmit()">Giriş Yap</button>
            </div>
        </div>
    </div>

    <header>
        <div class="logo">ZOME<span>chat</span></div>
        <div class="user-info">
            <span id="localUsername">Yükleniyor...</span>
            <button class="logout-btn" id="logoutBtn">Çıkış Yap</button>
        </div>
    </header>

    <div class="main-container">
        <div class="video-section">
            <div id="remoteVideoContainer">
                <div class="remote-info-tag"><i class="fa-solid fa-user"></i> <span id="remoteUsername">Yabancı</span></div>
                <div id="status">Bağlantı bekleniyor...</div>
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="video-overlay">
                <button class="control-btn skip" onclick="skipToNextUser()"><i class="fa-solid fa-forward"></i> Geç (Swipe)</button>
            </div>
        </div>
        <div class="chat-section">
            <div class="chat-header"><i class="fa-regular fa-comments"></i> Metin Sohbeti</div>
            <div id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Mesajınızı yazın..." autocomplete="off">
                <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // 👇 SENİN KENDİ ANAHTARLARINI YAZACAĞIN YER BURASI 👇
        const firebaseConfig = {
            apiKey: "BURAYA_PANELDEKİ_API_KEY_GELECEK",
            authDomain: "BURAYA_PANELDEKİ_AUTH_DOMAIN_GELECEK",
            projectId: "BURAYA_PANELDEKİ_PROJECT_ID_GELECEK",
            storageBucket: "BURAYA_PANELDEKİ_STORAGE_BUCKET_GELECEK",
            messagingSenderId: "BURAYA_PANELDEKİ_MESSAGING_SENDER_ID_GELECEK",
            appId: "BURAYA_PANELDEKİ_APP_ID_GELECEK"
        };
        
        // Güvenli Firebase Başlatıcı
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        window.auth = firebase.auth();
        window.googleProvider = new firebase.auth.GoogleAuthProvider();
    </script>

    <script src="script.js"></script>
</body>
</html>
