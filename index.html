<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOMEchat - Canlı Görüntülü Sohbet</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #c5c6c7; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { background-color: #1f2833; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #45f3ff; }
        .logo { font-size: 24px; font-weight: bold; color: #fff; }
        .logo span { color: #45f3ff; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        #localUsername { color: #45f3ff; font-weight: bold; }
        .logout-btn { background: none; border: 1px solid #ff4a4a; color: #ff4a4a; padding: 5px 10px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .logout-btn:hover { background-color: #ff4a4a; color: #fff; }
        
        .main-container { flex: 1; display: flex; position: relative; height: calc(100vh - 70px); }
        .video-section { flex: 1; position: relative; background-color: #000; display: flex; flex-direction: column; }
        #remoteVideoContainer { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; top: 20px; right: 20px; width: 150px; height: 110px; object-fit: cover; border-radius: 10px; border: 2px solid #45f3ff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10; transform: scaleX(-1); }
        
        .video-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
        .control-btn { background-color: rgba(31, 40, 51, 0.8); border: 2px solid #45f3ff; color: #45f3ff; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px); }
        .control-btn:hover { background-color: #45f3ff; color: #1f2833; box-shadow: 0 0 15px #45f3ff; }
        .control-btn.skip { border-color: #ffb703; color: #ffb703; width: 140px; border-radius: 30px; font-weight: bold; font-size: 16px; gap: 8px; }
        .control-btn.skip:hover { background-color: #ffb703; color: #1f2833; box-shadow: 0 0 15px #ffb703; }
        
        .remote-info-tag { position: absolute; top: 20px; left: 20px; background-color: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; border-left: 4px solid #45f3ff; font-weight: bold; z-index: 10; }
        #status { position: absolute; top: 70px; left: 20px; background-color: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 5px; font-size: 14px; z-index: 10; color: #aaa; }
        
        .chat-section { width: 350px; background-color: #191d24; display: flex; flex-direction: column; border-left: 2px solid #232931; transition: 0.3s; }
        .chat-header { padding: 15px; background-color: #1f2833; font-weight: bold; border-bottom: 1px solid #2c3540; display: flex; align-items: center; gap: 10px; }
        #chatMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-break: break-word; }
        .msg.me { background-color: #45f3ff; color: #1f2833; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 500; }
        .msg.stranger { background-color: #2c3540; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.system { background-color: rgba(255, 183, 3, 0.1); color: #ffb703; align-self: center; text-align: center; font-size: 13px; max-width: 100%; border-radius: 5px; border: 1px dashed rgba(255, 183, 3, 0.3); }
        .chat-input-area { padding: 15px; background-color: #1f2833; display: flex; gap: 10px; border-top: 1px solid #2c3540; }
        #chatInput { flex: 1; background-color: #0b0c10; border: 1px solid #45f3ff; padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        #sendBtn { background-color: #45f3ff; border: none; color: #1f2833; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; display: flex; justify-content: center; align-items: center; }
        #sendBtn:hover { opacity: 0.9; box-shadow: 0 0 10px #45f3ff; }

        /* GİRİŞ EKRANI TASARIMI */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0b0c10; z-index: 1000; display: flex; justify-content: center; align-items: center; transition: opacity 0.4s ease; }
        .login-box { background-color: #1f2833; padding: 40px; border-radius: 15px; border: 2px solid #45f3ff; width: 400px; box-shadow: 0 0 25px rgba(69, 243, 255, 0.2); text-align: center; }
        .login-box h1 { font-size: 32px; margin-bottom: 5px; color: #fff; }
        .login-box h1 span { color: #8a2be2; }
        .login-box p { color: #aaa; font-size: 14px; margin-bottom: 30px; }
        .google-btn { width: 100%; background-color: #fff; color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; transition: 0.3s; }
        .google-btn:hover { background-color: #f1f1f1; }
        .or-divider { margin: 20px 0; color: #555; position: relative; font-size: 14px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #2c3540; }
        .tab { flex: 1; padding: 10px; cursor: pointer; color: #aaa; font-weight: bold; transition: 0.3s; text-align: center; }
        .tab.active { color: #8a2be2; border-bottom: 3px solid #8a2be2; margin-bottom: -2px; }
        .login-form input { width: 100%; background-color: #0b0c10; border: 1px solid #45f3ff; padding: 12px; border-radius: 8px; color: #fff; margin-bottom: 15px; outline: none; font-size: 14px; }
        .login-form button { width: 100%; background-color: #8a2be2; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-form button:hover { background-color: #9932cc; box-shadow: 0 0 15px #8a2be2; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h1>ZOME<span>chat</span></h1>
            <p>Devam etmek için giriş yapın veya kayıt olun.</p>
            
            <button class="google-btn" id="googleLoginBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google__G__Logo.svg" alt="Google" width="18"> Google ile Giriş Yap
            </button>
            
            <div class="or-divider">veya e-posta kullanın</div>
            
            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="switchTab('login')">Giriş Yap</div>
                <div class="tab" id="tabRegister" onclick="switchTab('register')">Kayıt Ol</div>
            </div>
            
            <div class="login-form">
                <input type="text" id="authUsername" placeholder="Kullanıcı Adınız" style="display: none;">
                <input type="email" id="authEmail" placeholder="E-posta Adresiniz">
                <input type="password" id="authPassword" placeholder="Şifreniz">
                <button id="authSubmitBtn" onclick="handleAuthSubmit()">Giriş Yap</button>
            </div>
        </div>
    </div>

    <header>
        <div class="logo">ZOME<span>chat</span></div>
        <div class="user-info">
            <span id="localUsername">Yükleniyor...</span>
            <button class="logout-btn" id="logoutBtn">Çıkış Yap</button>
        </div>
    </header>

    <div class="main-container">
        <div class="video-section">
            <div id="remoteVideoContainer">
                <div class="remote-info-tag"><i class="fa-solid fa-user"></i> <span id="remoteUsername">Yabancı</span></div>
                <div id="status">Bağlantı bekleniyor...</div>
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            
            <div class="video-overlay">
                <button class="control-btn skip" onclick="skipToNextUser()"><i class="fa-solid fa-forward"></i> Geç (Swipe)</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header"><i class="fa-regular fa-comments"></i> Metin Sohbeti</div>
            <div id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Mesajınızı yazın..." autocomplete="off">
                <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDjfL1MIzV_ILaFMjpjags53Yi9Zz6mDHA", 
            authDomain: "proje-gir.firebaseapp.com",
            projectId: "proje-gir",
            storageBucket: "proje-gir.firebasestorage.app",
            messagingSenderId: "790926962812",
            appId: "1:790926962812:web:35ca08a8b2276609afd9f9"
        };
        
        // Başlatma
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        window.auth = firebase.auth();
        window.googleProvider = new firebase.auth.GoogleAuthProvider();

        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
            document.getElementById('authUsername').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('authSubmitBtn').innerText = mode === 'register' ? 'Kayıt Ol' : 'Giriş Yap';
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const username = document.getElementById('authUsername').value.trim();

            if(!email || !password) { alert("Lütfen tüm alanları doldurun."); return; }

            try {
                if (currentMode === 'register') {
                    if(!username) { alert("Lütfen kullanıcı adı belirleyin."); return; }
                    const result = await auth.createUserWithEmailAndPassword(email, password);
                    await result.user.updateProfile({ displayName: username });
                    window.startAppWithUser(username);
                } else {
                    const result = await auth.signInWithEmailAndPassword(email, password);
                    window.startAppWithUser(result.user.displayName);
                }
            } catch (error) {
                alert("Giriş Hatası: " + error.message);
            }
        }

        // Google Popup Giriş Fonksiyonu
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                const result = await auth.signInWithPopup(googleProvider);
                window.startAppWithUser(result.user.displayName);
            } catch (error) {
                alert("Google Giriş Hatası: " + error.message);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => {
                window.showLoginScreen();
            });
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
